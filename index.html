<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship Structure II · ติวสอบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EC;--card:#FFFDF8;--card2:#F1ECE0;--ink:#1E2D45;--ink2:#56657C;--sea:#7FB3D5;--sea-d:#2F6F99;--sea-l:#DDEBF5;--coral:#F2A07B;--coral-d:#B9562E;--coral-l:#FBE3D6;--line:#E4DCCB;--ok:#4FA372;--ok-l:#DDF0E3;--rev:#E8913A;--rev-l:#FBE8D2;--new:#CFC9BC;--bad:#C9503C;--bad-l:#F8DDD7;--shadow:0 1px 2px rgba(30,45,69,.06),0 4px 14px rgba(30,45,69,.06);--r:16px}
:root[data-theme="dark"]{--bg:#15223A;--card:#1D2D49;--card2:#22365A;--ink:#E9EFF7;--ink2:#A9B8CE;--sea:#7FB3D5;--sea-d:#9CCBEA;--sea-l:#264465;--coral:#F2A07B;--coral-d:#F5B08F;--coral-l:#4A3437;--line:#2F4469;--ok:#6CC08F;--ok-l:#1F4639;--rev:#F0A55A;--rev-l:#4A3A2A;--new:#5B6B86;--bad:#F08A76;--bad-l:#4A2D33;--shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.22)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100vh;padding-bottom:84px}
h1,h2,h3,h4,.hf{font-family:"Mitr","Sarabun",sans-serif;font-weight:500;line-height:1.3;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--sea-d)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* header */
header.top{position:relative;background:linear-gradient(180deg,var(--sea-l),var(--bg));padding:14px 0 26px;overflow:hidden}
header.top .wave{position:absolute;left:0;right:0;bottom:0;height:22px;opacity:.7}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:54px;height:44px;flex:none}
.brand h1{font-size:22px}
.brand small{display:block;font-family:"Sarabun",sans-serif;color:var(--ink2);font-size:14px;font-weight:500}
.tools{margin-left:auto;display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:18px}
nav.main{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
nav.main button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-family:"Mitr","Sarabun",sans-serif;font-size:15px;color:var(--ink2)}
nav.main button.on{background:var(--ink);color:var(--bg)}
nav.bottom{display:none}
@media (max-width:720px){
 nav.main{display:none}
 nav.bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink2);padding:4px 0;border-radius:10px;font-family:"Sarabun",sans-serif;font-weight:600}
 nav.bottom button span{font-size:20px;line-height:1.1}
 nav.bottom button.on{color:var(--ink);background:var(--sea-l)}
 body{font-size:16px}
 .brand h1{font-size:19px}
}
main{padding-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sec-t{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-t h2{font-size:20px}
.sec-t .sub{color:var(--ink2);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-family:"Mitr","Sarabun",sans-serif;font-size:15px;min-height:44px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sea{background:var(--sea);color:#14253D;border-color:var(--sea)}
.btn.coral{background:var(--coral);color:#3A1C0E;border-color:var(--coral)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)}
.small{font-size:14px}
/* mastery */
.mastery h2{font-size:18px}
.voyage{position:relative;height:96px;margin:10px 0 4px}
.voyage .sea{position:absolute;left:0;right:0;bottom:6px;height:30px;border-radius:12px;background:linear-gradient(180deg,var(--sea-l),color-mix(in srgb,var(--sea) 45%,var(--sea-l)))}
.voyage .dock{position:absolute;left:0;bottom:22px;width:44px}
.voyage .isle{position:absolute;right:0;bottom:16px;width:70px}
.voyage .boat{position:absolute;bottom:22px;width:58px;transform:translateX(-50%);transition:left 1s cubic-bezier(.3,.7,.3,1);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-3px) rotate(-2deg)}}
.tri{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--new)}
.tri i{display:block;height:100%}
.tri .g{background:var(--ok)}.tri .o{background:var(--rev)}.tri .n{background:var(--new)}
.tri.thin{height:8px}
.counts{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-weight:600}
.big{font-family:"Mitr","Sarabun",sans-serif;font-size:34px;line-height:1}
/* topic card */
.tcard{cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard h3{font-size:16px}
.tcard .th{color:var(--ink2);font-size:14px;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--card2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pill.t{background:var(--sea-l);color:var(--sea-d);border-color:transparent}
.pill.dup{background:var(--coral-l);color:var(--coral-d);border-color:transparent}
.pill.warn{background:var(--rev-l);color:var(--rev);border-color:transparent}
.pill.st-ok{background:var(--ok-l);color:var(--ok);border-color:transparent}
.pill.st-review{background:var(--rev-l);color:var(--rev);border-color:transparent}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.prog{flex:1;min-width:120px;height:8px;background:var(--card2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sea);transition:width .3s}
.qcard{padding:22px}
.qtext{font-size:20px;font-weight:600;margin:10px 0 16px;line-height:1.5}
@media(max-width:720px){.qtext{font-size:18px}.qcard{padding:16px}}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:52px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card2);font-family:"Mitr","Sarabun",sans-serif;font-size:15px}
.opt.sel{border-color:var(--sea);background:var(--sea-l)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.03)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:16px;border-radius:14px;padding:16px;border:1px solid var(--line);background:var(--card2)}
.fb h4{font-size:17px;margin-bottom:6px}
.fb .lbl{font-family:"Mitr","Sarabun",sans-serif;font-size:14px;color:var(--sea-d);margin-top:10px}
.fb ul{margin:4px 0 0;padding-left:20px}
.fb .note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--rev-l);font-size:15px}
.fb .fix{margin-top:10px;font-size:14px;color:var(--ink2)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.terms span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:14px}
.fig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:zoom-in;margin-top:10px}
.fig svg{width:100%;height:auto;display:block;max-height:280px}
.fig .cap{font-size:12px;color:var(--ink2);text-align:right}
/* svg styles */
svg .s{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}
svg .s2{stroke:var(--sea-d);stroke-width:3.5;fill:none}
svg .s3{stroke:var(--coral-d);stroke-width:3;fill:none}
svg .s4{stroke:var(--coral-d);stroke-width:2.5;fill:none}
svg .f1{fill:var(--sea-l)}
svg .f2{fill:var(--coral)}
svg .f3{fill:var(--card)}
svg .fi{fill:var(--coral-d)}
svg .w{stroke:var(--sea);stroke-width:2;fill:none}
svg .ax{stroke:var(--coral-d);stroke-width:2.2}
svg .ac{stroke:var(--coral-d);stroke-width:1.8;fill:none}
svg .ld{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 2}
svg .dash{stroke:var(--ink2);stroke-width:1.4;stroke-dasharray:6 4}
svg text{fill:var(--ink);font-family:"Sarabun",sans-serif}
svg .t{font-size:13px}
svg .ts,svg .ts text{font-size:11.5px}
svg .b{font-weight:700}
svg .hl{fill:var(--coral-d);font-weight:700}
.fig svg text.ld{fill:none}
/* streak */
.streak{font-family:"Mitr","Sarabun",sans-serif;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--coral-l);color:var(--coral-d)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-200%);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-family:"Mitr","Sarabun",sans-serif;z-index:80;transition:transform .35s;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.conf{position:fixed;pointer-events:none;z-index:79;width:9px;height:9px;border-radius:2px;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
/* switch */
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw .tr{width:40px;height:24px;border-radius:999px;background:var(--new);position:relative;transition:background .2s;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked + .tr{background:var(--sea-d)}
.sw input:checked + .tr::after{left:19px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,25,40,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:var(--shadow)}
.modal .box svg{width:100%;height:auto}
/* list rows */
.qrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .qt{flex:1;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:6px}
.dot.new{background:var(--new)}.dot.review{background:var(--rev)}.dot.ok{background:var(--ok)}
/* flash */
.flash{perspective:1200px;cursor:pointer;min-height:300px}
.flash .in{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);overflow:auto}
.flash .back{transform:rotateY(180deg);background:var(--sea-l)}
.flash .q{font-size:19px;font-weight:600}
.flash .ans{font-family:"Mitr","Sarabun",sans-serif;font-size:21px;color:var(--ink)}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.palette button{width:36px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13px}
.palette button.ans{background:var(--sea-l);border-color:var(--sea)}
.palette button.cur{outline:2px solid var(--ink)}
.timer{font-family:"Mitr","Sarabun",sans-serif;font-size:16px;padding:4px 12px;border-radius:10px;background:var(--card2)}
.timer.low{background:var(--bad-l);color:var(--bad)}
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res td,table.res th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
table.res th{font-family:"Mitr","Sarabun",sans-serif;font-weight:500;color:var(--ink2);font-size:14px}
.know ul{margin:6px 0 0;padding-left:20px}
.know li{margin:3px 0}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
.flagbox{background:var(--rev-l);border-color:transparent}
footer{margin:30px 0 10px;color:var(--ink2);font-size:13px;text-align:center}
</style>
</head>
<body>
<header class="top">
 <div class="wrap">
  <div class="brand">
   <svg viewBox="0 0 64 52" aria-hidden="true"><use href="#mascot"/></svg>
   <div><h1>Ship Structure II</h1><small>ติวสอบจากคลังข้อสอบ · ชีฟพาไปถึงเกาะ 100%</small></div>
   <div class="tools">
    <button class="icon-btn" id="themeBtn" title="สลับโหมดมืด/สว่าง" aria-label="สลับธีม">🌙</button>
    <button class="icon-btn" id="setBtn" title="ตั้งค่า" aria-label="ตั้งค่า">⚙️</button>
   </div>
  </div>
  <nav class="main" id="navTop"></nav>
 </div>
 <svg class="wave" viewBox="0 0 1200 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12 Q50 2 100 12 T200 12 T300 12 T400 12 T500 12 T600 12 T700 12 T800 12 T900 12 T1000 12 T1100 12 T1200 12 V22 H0Z" fill="var(--bg)"/><path d="M0 12 Q50 2 100 12 T200 12 T300 12 T400 12 T500 12 T600 12 T700 12 T800 12 T900 12 T1000 12 T1100 12 T1200 12" fill="none" stroke="var(--sea)" stroke-width="1.5" opacity=".7"/></svg>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap">คลังข้อสอบ Ship Structure II · 7 ชุด · เก็บความคืบหน้าไว้ในเบราว์เซอร์เครื่องนี้</footer>
<nav class="bottom" id="navBot"></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="mascot" viewBox="0 0 64 52">

  <circle cx="25" cy="23" r="2.2" fill="var(--sea)"/><circle cx="32" cy="23" r="2.2" fill="var(--sea)"/><circle cx="39" cy="23" r="2.2" fill="var(--sea)"/>
  <path d="M4 29 H60 L53 45 Q32 50 11 45 Z" fill="var(--sea)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="22" cy="36" r="2" fill="var(--ink)"/><circle cx="40" cy="36" r="2" fill="var(--ink)"/>
  <circle cx="22.7" cy="35.3" r=".6" fill="#fff"/><circle cx="40.7" cy="35.3" r=".6" fill="#fff"/>
  <path d="M28 39 q3 3 6 0" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>

 </symbol>
</svg>

<line class="ax" x1="185" y1="128" x2="110" y2="200" marker-end="url(#ar)"/>

<rect class="f1" x="70" y="132" width="240" height="40"/>
<path class="s" d="M70 132 L310 132"/>
<path class="s" d="M70 132 L44 152"/><path class="s" d="M310 132 L336 152"/>
<line class="s2" x1="190" y1="132" x2="190" y2="175"/>
<line class="s" x1="130" y1="132" x2="130" y2="175"/><line class="s" x1="250" y1="132" x2="250" y2="175"/>
<rect class="f2" x="170" y="173" width="40" height="6"/>

<g class="ts"><text x="196" y="14">Inner bottom / Tank top</text><line class="ld" x1="230" y1="18" x2="230" y2="131"/>
<text x="150" y="214">Keel plate (Flat plate keel)</text><line class="ld" x1="190" y1="203" x2="190" y2="180"/>

const DATA={"qs":{"AFT-1":{"id":"AFT-1","set":"AFT","n":1,"q":"What are the two main types of stern?","o":["Open stern and closed stern.","Cruiser stern and transom stern.","Flat stern and round stern.","Steel stern and wooden stern."],"a":1,"topic":"stern","exp":"ท้ายเรือมี 2 แบบหลักคือ Cruiser stern (ท้ายเรือแบบครุยเซอร์ ท้ายมนโค้ง) และ Transom stern (ท้ายเรือแบบตัดตรง/แผ่นท้ายแบน)","wrong":"ช้อยส์อื่นเป็นการแบ่งตามคำที่แต่งขึ้น (open/closed, flat/round) หรือแบ่งตามวัสดุ ไม่ใช่ประเภทท้ายเรือตามตำรา","terms":["Cruiser stern = ท้ายเรือแบบครุยเซอร์","Transom stern = ท้ายเรือแบบตัดตรง"]},"AFT-2":{"id":"AFT-2","set":"AFT","n":2,"q":"What is an advantage of a transom stern?","o":["It reduces deck space.","It increases construction difficulty.","It provides greater aft deck area.","It eliminates the rudder."],"a":2,"topic":"stern","exp":"Transom stern ท้ายตัดตรงทำให้ได้พื้นที่ดาดฟ้าท้ายเรือมากขึ้น และยังสร้างง่ายกว่าด้วย","wrong":"ทรานซอมไม่ได้ลดพื้นที่ดาดฟ้า ไม่ได้ทำให้สร้างยากขึ้น (กลับง่ายกว่า) และยังต้องมีหางเสือ","terms":["Aft deck area = พื้นที่ดาดฟ้าท้ายเรือ"]},"AFT-3":{"id":"AFT-3","set":"AFT","n":3,"q":"What supports the plating of a transom stern?","o":["Horizontal pipes.","Vertical stiffeners.","Propeller blades.","Rudder stocks."],"a":1,"topic":"stern","exp":"แผ่นเหล็กท้ายตัดตรง (transom plating) เสริมแรงด้วย vertical stiffeners (เหล็กเสริมแนวตั้ง)","wrong":"ท่อ ใบจักร และแกนหางเสือ ไม่ใช่ชิ้นส่วนรับแผ่นทรานซอม","terms":["Stiffener = เหล็กเสริมแรง","Transom = แผ่นท้ายเรือตัดตรง"]},"AFT-4":{"id":"AFT-4","set":"AFT","n":4,"q":"What is used in the construction of a cruiser stern?","o":["Cant frames.","Propeller shafts.","Rudder blades.","Steering pumps."],"a":0,"topic":"stern","exp":"Cruiser stern ท้ายโค้งมน จึงใช้ Cant frames (กงเฉียง กงที่วางแผ่รอบท้ายเรือ) เพื่อรับรูปทรงโค้ง","wrong":"เพลาใบจักร ใบหางเสือ และปั๊มถือท้าย เป็นอุปกรณ์ ไม่ใช่โครงสร้างที่ใช้ขึ้นรูปท้าย","terms":["Cant frame = กงเฉียง (กงที่แผ่ออกเป็นรัศมีรอบท้าย)"]},"AFT-5":{"id":"AFT-5","set":"AFT","n":5,"q":"What is the purpose of streamlining the stern frame?","o":["To increase ship weight.","To reduce eddies and hull resistance.","To increase propeller size.","To reduce rudder movement."],"a":1,"topic":"stern","exp":"การทำ Stern frame (โครงท้ายเรือ) ให้เพรียวลม ช่วยลดกระแสน้ำวน (eddies) และลดความต้านทานตัวเรือ","wrong":"การทำให้เพรียวไม่ได้มีไว้เพิ่มน้ำหนัก เพิ่มขนาดใบจักร หรือลดการขยับหางเสือ","terms":["Stern frame = โครงท้ายเรือ","Eddies = กระแสน้ำวน","Hull resistance = ความต้านทานตัวเรือ"]},"AFT-6":{"id":"AFT-6","set":"AFT","n":6,"q":"What materials can be used to make a stern frame?","o":["Plastic and rubber.","Wood and glass.","Cast, forged, or fabricated steel.","Copper and aluminium only."],"a":2,"topic":"stern","exp":"Stern frame ทำจากเหล็กหล่อ (cast) เหล็กทุบขึ้นรูป (forged) หรือเหล็กประกอบเชื่อม (fabricated)","wrong":"พลาสติก ยาง ไม้ แก้ว หรือทองแดง/อะลูมิเนียมอย่างเดียว ไม่แข็งแรงพอสำหรับโครงท้ายที่รับแรงสูง","terms":["Cast steel = เหล็กหล่อ","Forged steel = เหล็กทุบขึ้นรูป","Fabricated = ประกอบด้วยการเชื่อม"]},"AFT-7":{"id":"AFT-7","set":"AFT","n":7,"q":"Why is clearance required between the stern frame and propeller?","o":["To reduce vibration.","To increase ship weight.","To stop rudder movement.","To reduce deck space."],"a":0,"topic":"stern","exp":"ต้องเว้นระยะห่าง (clearance) ระหว่างโครงท้ายกับใบจักร เพื่อลดการสั่นสะเทือน (vibration) จากแรงดันน้ำที่ใบจักรปั่น","wrong":"ระยะห่างไม่ได้เกี่ยวกับน้ำหนักเรือ การหยุดหางเสือ หรือพื้นที่ดาดฟ้า","terms":["Clearance = ระยะห่าง","Vibration = การสั่นสะเทือน"]},"AFT-8":{"id":"AFT-8","set":"AFT","n":8,"q":"What is a semibalanced rudder?","o":["A rudder with all its area behind the turning axis.","A rudder with less than 20% of its area forward of the turning axis.","A rudder with 50% of its area forward of the turning axis.","A rudder without a turning axis."],"a":1,"topic":"rud","exp":"Semi-balanced rudder (หางเสือกึ่งสมดุล) มีพื้นที่ด้านหน้าแกนหมุนน้อยกว่า 20%","wrong":"A คือหางเสือไม่สมดุล (unbalanced) ที่พื้นที่ทั้งหมดอยู่หลังแกน; C ตัวเลข 50% มากเกินไป (ของ balanced คือ 25–30%); D หางเสือต้องมีแกนหมุนเสมอ","terms":["Semi-balanced rudder = หางเสือกึ่งสมดุล","Turning axis = แกนหมุน"]},"AFT-9":{"id":"AFT-9","set":"AFT","n":9,"q":"What percentage of a balanced rudder's area is forward of the turning axis?","o":["5–10%.","10–15%.","25–30%.","40–50%."],"a":2,"topic":"rud","exp":"Balanced rudder (หางเสือสมดุล) มีพื้นที่ด้านหน้าแกนหมุนประมาณ 25–30%","wrong":"ช่วงตัวเลขอื่นไม่ตรงตำรา (น้อยกว่า 20% คือ semi-balanced)","terms":["Balanced rudder = หางเสือสมดุล"]},"AFT-10":{"id":"AFT-10","set":"AFT","n":10,"q":"What is the main advantage of a balanced rudder?","o":["It reduces torque.","It increases hull resistance.","It prevents propeller rotation.","It increases ship weight."],"a":0,"topic":"rud","exp":"เพราะพื้นที่ส่วนหน้าแกนช่วยดันกลับ แรงบิด (torque) ที่ต้องใช้หมุนหางเสือจึงลดลง เครื่องถือท้ายเล็กลงได้","wrong":"หางเสือสมดุลไม่ได้เพิ่มความต้านทาน ไม่ได้หยุดใบจักร และไม่ได้เพิ่มน้ำหนัก","terms":["Torque = แรงบิด"]},"AFT-11":{"id":"AFT-11","set":"AFT","n":11,"q":"What material is commonly used to construct modern rudders?","o":["Glass.","Steel plate.","Wood.","Rubber."],"a":1,"topic":"rud","exp":"หางเสือสมัยใหม่สร้างจากแผ่นเหล็ก (steel plate) แบบกลวง ทำเป็นรูปทรงเพรียว","wrong":"แก้ว ไม้ ยาง ไม่ใช่วัสดุหางเสือเรือสินค้าสมัยใหม่","terms":["Steel plate = แผ่นเหล็ก"]},"AFT-12":{"id":"AFT-12","set":"AFT","n":12,"q":"What is the purpose of internal webs in a rudder?","o":["To stiffen the rudder.","To increase water resistance.","To control engine speed.","To support the propeller."],"a":0,"topic":"rud","exp":"ภายในหางเสือมี internal webs (แผ่นผนังภายใน) เพื่อเสริมความแข็งแรง (stiffen)","wrong":"แผ่นภายในไม่ได้เพิ่มความต้านทานน้ำ ไม่คุมความเร็วเครื่อง และไม่รับใบจักร","terms":["Internal web = แผ่นโครงภายใน"]},"AFT-13":{"id":"AFT-13","set":"AFT","n":13,"q":"What is the purpose of a drain hole in a rudder?","o":["To increase rudder weight.","To allow drainage.","To control steering speed.","To lubricate the propeller."],"a":1,"topic":"rud","exp":"Drain hole (รูระบายน้ำ) ใช้ระบายน้ำ (และใช้ทดสอบความดัน) ออกจากหางเสือ","wrong":"รูระบายไม่ได้เพิ่มน้ำหนัก ไม่คุมความเร็วการถือท้าย และไม่หล่อลื่นใบจักร","terms":["Drain hole = รูระบาย"]},"AFT-14":{"id":"AFT-14","set":"AFT","n":14,"q":"What are pintles and gudgeons used for?","o":["Supporting the rudder.","Driving the main engine.","Cooling the propeller shaft.","Controlling fuel flow."],"a":0,"topic":"rud","exp":"Pintles (หมุดหางเสือ) และ Gudgeons (ห่วงรับหมุด) ใช้ยึดและรองรับหางเสือกับ stern frame ให้หมุนได้","wrong":"ไม่เกี่ยวกับการขับเครื่องยนต์ ระบายความร้อนเพลา หรือคุมน้ำมัน","terms":["Pintle = หมุดหางเสือ","Gudgeon = ห่วงรับหมุดหางเสือ"]},"AFT-15":{"id":"AFT-15","set":"AFT","n":15,"q":"What material is commonly used for a rudder stock?","o":["Plastic.","Cast or forged steel.","Glass fibre only.","Rubber."],"a":1,"topic":"rud","exp":"Rudder stock (แกนหางเสือ) ทำจากเหล็กหล่อหรือเหล็กทุบ เพราะรับแรงบิดสูง","wrong":"พลาสติก ใยแก้ว ยาง รับแรงบิดสูงไม่ได้","terms":["Rudder stock = แกนหางเสือ"]},"AFT-16":{"id":"AFT-16","set":"AFT","n":16,"q":"What is the purpose of a rudder trunk?","o":["To house the rudder stock.","To support the propeller blades.","To store fuel.","To cool the steering motor."],"a":0,"topic":"rud","exp":"Rudder trunk (ช่องท่อแกนหางเสือ) เป็นช่องที่แกนหางเสือผ่านจากหางเสือขึ้นไปยังห้องเครื่องถือท้าย","wrong":"ไม่ได้รับใบจักร เก็บน้ำมัน หรือระบายความร้อนมอเตอร์","terms":["Rudder trunk = ช่องท่อแกนหางเสือ"]},"AFT-17":{"id":"AFT-17","set":"AFT","n":17,"q":"What is the purpose of the watertight gland at the top of the rudder trunk?","o":["To increase water flow.","To prevent water from entering.","To increase rudder torque.","To reduce propeller speed."],"a":1,"topic":"rud","exp":"Watertight gland (ซีลกันน้ำ) ที่ปลายบนของ rudder trunk กันน้ำทะเลไม่ให้เข้าตัวเรือ","wrong":"ซีลไม่ได้เพิ่มการไหลของน้ำ เพิ่มแรงบิด หรือลดรอบใบจักร","terms":["Watertight gland = ซีลกันน้ำ/ต่อมกันน้ำ"]},"AFT-18":{"id":"AFT-18","set":"AFT","n":18,"q":"What is the main function of steering gear?","o":["To control the rudder movement.","To cool the main engine.","To lubricate the propeller.","To control cargo loading."],"a":0,"topic":"rud","exp":"Steering gear (เครื่องถือท้าย) ทำหน้าที่ควบคุมการหมุนของหางเสือ","wrong":"ไม่เกี่ยวกับการระบายความร้อนเครื่อง หล่อลื่นใบจักร หรือขนถ่ายสินค้า","terms":["Steering gear = เครื่องถือท้าย"]},"AFT-19":{"id":"AFT-19","set":"AFT","n":19,"q":"What rudder movement is required for the main steering gear in the specified test?","o":["From 15° on one side to 15° on the other.","From 20° on one side to 20° on the other.","From 35° on one side to 35° on the other.","From 45° on one side to 45° on the other."],"a":2,"topic":"rud","exp":"ตาม SOLAS เครื่องถือท้ายหลักต้องหมุนหางเสือได้จาก 35° ด้านหนึ่งถึง 35° อีกด้าน ที่ความเร็วเดินหน้าสูงสุดและกินน้ำลึกสูงสุด","wrong":"15° เป็นข้อกำหนดของเครื่องถือท้ายสำรอง; 20° และ 45° ไม่ตรงข้อกำหนด","terms":["Main steering gear = เครื่องถือท้ายหลัก"]},"AFT-20":{"id":"AFT-20","set":"AFT","n":20,"q":"What is the specified time for the main steering gear to move the rudder from 35° on one side to 30° on the other?","o":["10 seconds.","28 seconds.","45 seconds.","60 seconds."],"a":1,"topic":"rud","exp":"ข้อกำหนดเวลา: จาก 35° ด้านหนึ่งไปถึง 30° อีกด้าน ต้องไม่เกิน 28 วินาที","wrong":"60 วินาทีเป็นของเครื่องถือท้ายสำรอง (15°→15°); 10 และ 45 วินาทีไม่ตรงข้อกำหนด","terms":["Specified time = เวลาตามข้อกำหนด"]},"AFT-21":{"id":"AFT-21","set":"AFT","n":21,"q":"What rudder movement is required for the auxiliary steering gear?","o":["From 15° on one side to 15° on the other.","From 25° on one side to 25° on the other.","From 35° on one side to 35° on the other.","From 45° on one side to 45° on the other."],"a":0,"topic":"rud","exp":"เครื่องถือท้ายสำรอง (auxiliary) ต้องหมุนจาก 15° ด้านหนึ่งถึง 15° อีกด้าน (ที่ครึ่งความเร็วสูงสุดหรือ 7 นอต แล้วแต่ค่าใดมากกว่า)","wrong":"35° คือของเครื่องหลัก; 25° และ 45° ไม่ตรงข้อกำหนด","terms":["Auxiliary steering gear = เครื่องถือท้ายสำรอง"]},"AFT-22":{"id":"AFT-22","set":"AFT","n":22,"q":"What is the specified time for the auxiliary steering gear to move the rudder from 15° on one side to 15° on the other?","o":["15 seconds.","28 seconds.","45 seconds.","60 seconds."],"a":3,"topic":"rud","exp":"เครื่องถือท้ายสำรอง 15°→15° ต้องไม่เกิน 60 วินาที","wrong":"28 วินาทีเป็นของเครื่องหลัก; 15 และ 45 วินาทีไม่ตรงข้อกำหนด","terms":[]},"AFT-23":{"id":"AFT-23","set":"AFT","n":23,"q":"What type of steering gear is generally used on ocean-going ships?","o":["Manual steering gear only.","Electro-hydraulic steering gear.","Steam-powered steering gear only.","Mechanical steering gear without power."],"a":1,"topic":"rud","exp":"เรือเดินสมุทรส่วนใหญ่ใช้ Electro-hydraulic steering gear (เครื่องถือท้ายไฟฟ้า-ไฮดรอลิก)","wrong":"แบบมือ แบบไอน้ำ หรือแบบกลไกไม่มีกำลัง ไม่ใช่แบบที่ใช้ทั่วไปในเรือใหญ่ปัจจุบัน","terms":["Electro-hydraulic = ไฟฟ้า-ไฮดรอลิก"]},"AFT-24":{"id":"AFT-24","set":"AFT","n":24,"q":"What is the main function of a sterntube?","o":["To support the propeller shaft at the after bearing.","To control the rudder angle.","To store lubricating oil for the engine.","To support the ship's deck."],"a":0,"topic":"prop","exp":"Sterntube (ท่อท้ายเรือ) เป็นที่ตั้งแบริ่งท้ายสุดรองรับเพลาใบจักร และมีซีลกันน้ำ","wrong":"การคุมมุมหางเสือ เก็บน้ำมันเครื่อง หรือรับดาดฟ้า ไม่ใช่หน้าที่ของ sterntube","terms":["Sterntube = ท่อท้ายเรือ (ท่อเพลาใบจักร)","Propeller shaft = เพลาใบจักร","Bearing = แบริ่ง/ตลับลูกปืน"]},"AFT-25":{"id":"AFT-25","set":"AFT","n":25,"q":"What is the purpose of a watertight gland at the sterntube?","o":["To increase shaft speed.","To prevent water entering the hull.","To increase propeller thrust.","To control steering gear."],"a":1,"topic":"prop","exp":"Watertight gland ที่ sterntube กันน้ำทะเลไม่ให้เข้าตัวเรือตามแนวเพลา","wrong":"ซีลไม่ได้เพิ่มรอบเพลา เพิ่มแรงขับ หรือคุมเครื่องถือท้าย","terms":["Watertight gland = ซีลกันน้ำ"]},"AFT-26":{"id":"AFT-26","set":"AFT","n":26,"q":"What is a characteristic of a water-lubricated sterntube bearing?","o":["It is closed at both ends and filled with oil.","It is open to the sea.","It contains no bearing.","It is used only for steering."],"a":1,"topic":"prop","exp":"แบริ่งท้ายเรือแบบหล่อลื่นด้วยน้ำ (water-lubricated) จะเปิดสู่ทะเลให้น้ำทะเลเข้าไปหล่อลื่น","wrong":"A คือแบบหล่อลื่นด้วยน้ำมัน (oil-lubricated) ที่ปิดทั้งสองปลาย; C ต้องมีแบริ่งเสมอ; D sterntube ไม่ได้ใช้ถือท้าย","terms":["Water-lubricated = หล่อลื่นด้วยน้ำ"],"fix":"แยกช้อยส์ B และ C ที่ต้นฉบับพิมพ์ติดกันในบรรทัดเดียว"},"AFT-27":{"id":"AFT-27","set":"AFT","n":27,"q":"What is the purpose of bossings or A-brackets?","o":["To support overhanging propeller shafts.","To control the rudder stock.","To increase cargo capacity.","To cool the main engine."],"a":0,"topic":"prop","exp":"Bossing หรือ A-bracket (ขาค้ำรูปตัว A) ใช้รองรับเพลาใบจักรส่วนที่ยื่นออกนอกตัวเรือ (มักพบในเรือสองใบจักร)","wrong":"ไม่ได้คุมแกนหางเสือ เพิ่มระวาง หรือระบายความร้อนเครื่อง","terms":["Bossing = ส่วนนูนหุ้มเพลา","A-bracket = ขาค้ำเพลารูปตัว A"]},"AFT-28":{"id":"AFT-28","set":"AFT","n":28,"q":"What is the function of a spectacle frame?","o":["To provide the aftermost bearing support.","To control propeller pitch.","To support the rudder trunk.","To supply electricity to the ship."],"a":0,"topic":"prop","exp":"Spectacle frame (โครงแว่นตา) อยู่ปลาย bossing ของเรือสองใบจักร เป็นที่รับแบริ่งท้ายสุดของเพลา","wrong":"ไม่ได้คุมพิตช์ใบจักร ไม่รับ rudder trunk และไม่จ่ายไฟฟ้า","terms":["Spectacle frame = โครงแว่นตา (รับเพลาสองข้าง)"]},"AFT-29":{"id":"AFT-29","set":"AFT","n":29,"q":"How many blades do propellers commonly have according to the chapter?","o":["1–2 blades.","3–6 blades.","7–10 blades.","10–12 blades."],"a":1,"topic":"prop","exp":"ใบจักรทั่วไปมี 3–6 ใบ","wrong":"1–2 ใบน้อยเกินสำหรับเรือสินค้า; 7–12 ใบมากเกินช่วงปกติตามตำรา","terms":["Blade = ใบ (ของใบจักร)"]},"AFT-30":{"id":"AFT-30","set":"AFT","n":30,"q":"What is an advantage of a controllable-pitch propeller?","o":["Its pitch can be adjusted while running.","It cannot change thrust.","It must stop before changing pitch.","It removes the need for a propeller shaft."],"a":0,"topic":"prop","exp":"Controllable-pitch propeller (ใบจักรปรับพิตช์ได้) ปรับมุมใบได้ขณะเพลาหมุน ทำให้เปลี่ยนแรงขับ/เดินหน้า-ถอยหลังได้โดยไม่ต้องกลับทางเครื่อง","wrong":"B/C ตรงข้ามกับคุณสมบัติจริง; D ยังต้องมีเพลา","terms":["Controllable-pitch propeller (CPP) = ใบจักรปรับพิตช์ได้","Pitch = ระยะพิตช์/มุมใบ"]},"AFT-31":{"id":"AFT-31","set":"AFT","n":31,"q":"What is the purpose of a shrouded propeller or nozzle?","o":["To increase thrust at low speeds and high slips.","To reduce rudder area.","To prevent shaft rotation.","To increase hull resistance."],"a":0,"topic":"prop","exp":"Shrouded propeller / Nozzle (ใบจักรมีท่อครอบ) เพิ่มแรงขับที่ความเร็วต่ำและสลิปสูง เช่น เรือลากจูง","wrong":"ท่อครอบไม่ได้ลดพื้นที่หางเสือ หยุดเพลา หรือเพิ่มความต้านทาน","terms":["Nozzle = ท่อครอบใบจักร","Slip = สลิป (ความต่างระหว่างระยะพิตช์กับระยะที่เรือเคลื่อนจริง)"]},"AFT-32":{"id":"AFT-32","set":"AFT","n":32,"q":"What is an advantage of electric podded propulsors?","o":["They require more internal shafting.","They eliminate internal shafting.","They eliminate the need for electricity.","They cannot be used for propulsion."],"a":1,"topic":"prop","exp":"Electric podded propulsor (พ็อดขับเคลื่อนไฟฟ้า) มีมอเตอร์อยู่ในพ็อดใต้ท้องเรือ จึงไม่ต้องมีเพลายาวภายในตัวเรือ","wrong":"A กลับด้าน; C พ็อดใช้ไฟฟ้า; D ใช้ขับเคลื่อนได้","terms":["Podded propulsor = พ็อดขับเคลื่อน","Shafting = ระบบเพลา"]},"BHD-1":{"id":"BHD-1","set":"BHD","n":1,"q":"What is a bulkhead?","o":["A horizontal deck structure.","A vertical partition in a ship.","A type of ship engine.","A type of propeller."],"a":1,"topic":"bhd","exp":"Bulkhead (ผนังกั้น) คือแผ่นกั้นแนวตั้งที่แบ่งพื้นที่ภายในเรือ","wrong":"A คือดาดฟ้า (deck) ซึ่งเป็นแนวนอน; C/D ไม่ใช่โครงสร้าง","terms":["Bulkhead = ผนังกั้น(ห้อง)ในเรือ","Partition = แผ่นกั้น"]},"BHD-2":{"id":"BHD-2","set":"BHD","n":2,"q":"What is the main purpose of watertight bulkheads?","o":["To increase engine speed.","To store cargo.","To divide the hull into watertight compartments.","To support the propeller."],"a":2,"topic":"bhd","exp":"Watertight bulkhead (ผนังกั้นน้ำ) แบ่งตัวเรือเป็นห้องผนึกกันน้ำ (watertight compartments) ถ้ารั่วห้องหนึ่ง เรือยังลอยได้","wrong":"ไม่ได้เพิ่มความเร็วเครื่อง เก็บสินค้า หรือรับใบจักร","terms":["Watertight compartment = ห้องผนึกกันน้ำ"]},"BHD-3":{"id":"BHD-3","set":"BHD","n":3,"q":"What can a strong watertight bulkhead help prevent?","o":["Fuel consumption.","Flooding from spreading to other compartments.","Propeller vibration.","Engine overheating."],"a":1,"topic":"bhd","exp":"ผนังกั้นน้ำที่แข็งแรงช่วยกันไม่ให้น้ำท่วมลามไปห้องอื่น","wrong":"ผนังกั้นไม่เกี่ยวกับการใช้น้ำมัน การสั่นใบจักร หรือความร้อนเครื่อง","terms":["Flooding = น้ำท่วม"]},"BHD-4":{"id":"BHD-4","set":"BHD","n":4,"q":"What is a minor bulkhead mainly used for?","o":["Subdividing accommodation or stores.","Supporting the main engine.","Carrying the propeller shaft.","Holding ballast water."],"a":0,"topic":"bhd","exp":"Minor bulkhead (ผนังกั้นรอง) เป็นผนังเบา ใช้แบ่งที่พักหรือห้องเก็บของ ไม่ได้มีหน้าที่กันน้ำ/รับแรงหลัก","wrong":"การรับเครื่องหลัก เพลา หรือกักน้ำอับเฉา ต้องใช้โครงสร้างหลัก","terms":["Minor bulkhead = ผนังกั้นรอง","Accommodation = ที่พักลูกเรือ","Stores = ห้องเก็บของ"]},"BHD-5":{"id":"BHD-5","set":"BHD","n":5,"q":"What is the main function of a collision bulkhead?","o":["To protect the ship from flooding after bow damage.","To support the main engine.","To store fuel oil.","To support the rudder."],"a":0,"topic":"bhd","exp":"Collision bulkhead (ผนังกั้นการชน) ป้องกันน้ำท่วมเข้าเรือเมื่อหัวเรือเสียหายจากการชน","wrong":"ไม่ได้รับเครื่องหลัก เก็บน้ำมัน หรือรับหางเสือ","terms":["Collision bulkhead = ผนังกั้นการชน"]},"BHD-6":{"id":"BHD-6","set":"BHD","n":6,"q":"Where is the collision bulkhead located?","o":["Near the stern.","In the engine room.","Forward in the ship.","At the centre of the ship."],"a":2,"topic":"bhd","exp":"Collision bulkhead อยู่ทางหัวเรือ (ผนังกั้นน้ำตัวแรกทางหัว ห่างจาก forward perpendicular ตามข้อบังคับ)","wrong":"ท้ายเรือมี aft peak bulkhead; ห้องเครื่องมี machinery bulkhead","terms":["Forward = ทางหัวเรือ"]},"BHD-7":{"id":"BHD-7","set":"BHD","n":7,"q":"What is the purpose of the aft peak bulkhead?","o":["To enclose the stern tubes in a watertight compartment.","To support the cargo hatch.","To store fresh water.","To support the main engine."],"a":0,"topic":"bhd","exp":"Aft peak bulkhead (ผนังกั้นห้องท้ายสุด) ทำให้ stern tube อยู่ในห้องผนึกกันน้ำ ถ้าซีลเพลารั่ว น้ำไม่ลามเข้าเรือ","wrong":"ไม่เกี่ยวกับฝาระวาง น้ำจืด หรือเครื่องหลัก","terms":["Aft peak = ห้องท้ายสุดของเรือ","Stern tube = ท่อท้ายเรือ"]},"BHD-8":{"id":"BHD-8","set":"BHD","n":8,"q":"What do machinery bulkheads provide?","o":["A cargo storage area.","A self-contained compartment for engines and boilers.","A fuel tank.","A passenger accommodation area."],"a":1,"topic":"bhd","exp":"Machinery bulkheads (ผนังกั้นห้องเครื่อง) ทำให้ห้องเครื่องยนต์และหม้อไอน้ำเป็นห้องแยกในตัวเอง","wrong":"ไม่ใช่ระวางสินค้า ถังน้ำมัน หรือที่พักผู้โดยสาร","terms":["Machinery space = ห้องเครื่อง","Boiler = หม้อไอน้ำ"]},"BHD-9":{"id":"BHD-9","set":"BHD","n":9,"q":"What is one function of watertight bulkheads in a fire?","o":["Increase ship speed.","Prevent the spread of fire.","Reduce fuel consumption.","Increase cargo capacity."],"a":1,"topic":"bhd","exp":"ผนังกั้นน้ำทำหน้าที่เป็นผนังกันไฟด้วย ช่วยกันไฟลามไปห้องอื่น","wrong":"ไม่เพิ่มความเร็ว ลดน้ำมัน หรือเพิ่มระวาง","terms":["Fire = ไฟ"]},"BHD-10":{"id":"BHD-10","set":"BHD","n":10,"q":"Why does the thickness of bulkhead plating increase with depth?","o":["Because water pressure increases with depth.","Because temperature increases with depth.","Because the ship becomes wider.","Because the deck becomes lighter."],"a":0,"topic":"bhd","exp":"ความดันน้ำเพิ่มตามความลึก (p = ρgh) ผนังส่วนล่างรับแรงดันมากกว่า แผ่นเหล็กจึงหนาขึ้นตามความลึก","wrong":"ไม่เกี่ยวกับอุณหภูมิ ความกว้างเรือ หรือน้ำหนักดาดฟ้า","terms":["Water pressure = ความดันน้ำ","p = ρgh (ρ ความหนาแน่นน้ำ, g ความเร่งโน้มถ่วง, h ความลึก)"]},"BHD-11":{"id":"BHD-11","set":"BHD","n":11,"q":"What type of stiffeners are commonly fitted to transverse watertight bulkheads?","o":["Vertical stiffeners.","Circular stiffeners.","Wooden stiffeners.","Plastic stiffeners."],"a":0,"topic":"bhd","exp":"ผนังกั้นน้ำตามขวางมักใช้ vertical stiffeners (เหล็กเสริมแนวตั้ง) เพราะความดันเปลี่ยนตามความลึก","wrong":"แบบวงกลม ไม้ หรือพลาสติก ไม่ใช่ของจริง","terms":["Transverse bulkhead = ผนังกั้นตามขวาง","Vertical stiffener = เหล็กเสริมแนวตั้ง"]},"BHD-12":{"id":"BHD-12","set":"BHD","n":12,"q":"What is the purpose of horizontal stringers on a bulkhead?","o":["To reduce the unsupported span of stiffeners.","To increase fuel capacity.","To support the propeller.","To reduce ship length."],"a":0,"topic":"bhd","exp":"Horizontal stringers (คานนอนรับผนัง) ช่วยลดช่วงยาวที่ไม่มีอะไรรองรับ (unsupported span) ของ stiffener แนวตั้ง ทำให้ใช้ stiffener เล็กลงได้","wrong":"ไม่เพิ่มถังน้ำมัน ไม่รับใบจักร ไม่ลดความยาวเรือ","terms":["Stringer = คานนอน","Unsupported span = ช่วงที่ไม่มีที่รองรับ"]},"BHD-13":{"id":"BHD-13","set":"BHD","n":13,"q":"What is a corrugated bulkhead designed to provide?","o":["Sufficient rigidity without conventional stiffeners.","More passenger space.","More engine power.","Higher fuel consumption."],"a":0,"topic":"bhd","exp":"Corrugated bulkhead (ผนังลอนพับ) ใช้รูปลอนให้แข็งแรงพอโดยไม่ต้องติด stiffener แบบธรรมดา ทำความสะอาดง่าย (นิยมในเรือบรรทุกน้ำมัน/สารเคมี)","wrong":"ไม่ได้มีไว้เพิ่มพื้นที่ผู้โดยสาร กำลังเครื่อง หรือการใช้น้ำมัน","terms":["Corrugated bulkhead = ผนังลอนพับ","Rigidity = ความแข็งเกร็ง"]},"BHD-14":{"id":"BHD-14","set":"BHD","n":14,"q":"Where is a bulkhead stool generally fitted in a bulk carrier?","o":["At the upper deck.","At the lower end of the bulkhead.","Inside the engine.","At the bow only."],"a":1,"topic":"bhd","exp":"ในเรือบรรทุกสินค้าเทกอง ผนังลอนมีฐาน (stool) อยู่ที่ปลายล่างของผนัง","wrong":"ไม่ได้อยู่ที่ดาดฟ้าบน ในเครื่องยนต์ หรือที่หัวเรือเท่านั้น (หมายเหตุ: บางลำมี upper stool ด้วย แต่ตามตำราคำตอบคือปลายล่าง)","terms":["Bulkhead stool = ฐานผนังกั้น","Bulk carrier = เรือบรรทุกสินค้าเทกอง"]},"BHD-15":{"id":"BHD-15","set":"BHD","n":15,"q":"What is the purpose of a bulkhead stool?","o":["To provide a shedder surface for cargo removal.","To store fuel oil.","To support the rudder.","To increase engine speed."],"a":0,"topic":"bhd","exp":"ผนังลาดเอียงของ stool เป็นพื้นผิวให้สินค้าเทกองไหล/ลื่นลง (shedder surface) ทำให้ขนสินค้าออกง่าย","wrong":"ไม่ได้เก็บน้ำมัน รับหางเสือ หรือเพิ่มรอบเครื่อง","terms":["Shedder surface = ผิวลาดให้สินค้าไหลลง"]},"BHD-16":{"id":"BHD-16","set":"BHD","n":16,"q":"How are the boundaries of a watertight bulkhead connected to the ship structure?","o":["By loose bolts.","By double continuously fillet welding.","By wooden joints.","By plastic joints."],"a":1,"topic":"bhd","exp":"ขอบผนังกั้นน้ำต่อกับโครงสร้างเรือด้วยการเชื่อมพอกต่อเนื่องสองด้าน (double continuous fillet welding) ให้ผนึกกันน้ำ","wrong":"สลักหลวม ข้อต่อไม้หรือพลาสติก ไม่กันน้ำ","terms":["Fillet weld = การเชื่อมพอก (มุม)"]},"BHD-17":{"id":"BHD-17","set":"BHD","n":17,"q":"What is used when a ventilation trunk passes through a watertight bulkhead?","o":["A fuel valve.","A watertight shutter.","A propeller.","A cargo hook."],"a":1,"topic":"bhd","exp":"ถ้าท่อระบายอากาศผ่านผนังกั้นน้ำ ต้องมี watertight shutter (บานปิดกันน้ำ) เพื่อปิดได้เมื่อเกิดเหตุ","wrong":"วาล์วน้ำมัน ใบจักร ตะขอสินค้า ไม่เกี่ยว","terms":["Ventilation trunk = ท่อระบายอากาศ","Shutter = บานปิด"]},"BHD-18":{"id":"BHD-18","set":"BHD","n":18,"q":"What is the main purpose of a watertight door?","o":["To provide access between compartments while maintaining watertight integrity.","To increase ventilation.","To store cargo.","To support the deck."],"a":0,"topic":"bhd","exp":"Watertight door (ประตูกันน้ำ) ให้คนผ่านระหว่างห้องได้ แต่ยังรักษาควา ree surface effects and liquid movement.","To increase engine power.","To support the rudder.","To increase ship speed."],"a":0,"topic":"pil","exp":"ผนังกลางลำ (centreline bulkhead) ในถังน้ำมันช่วยลดผลของผิวอิสระ (free surface effect) และการกระฉอกของของเหลว ซึ่งช่วยเรื่องเสถียรภาพ","wrong":"ไม่เพิ่มกำลังเครื่อง รับหางเสือ หรือเพิ่มความเร็ว","terms":["Free surface effect = ผลของผิวของเหลวอิสระ (ลด GM)"]},"BHD-24":{"id":"BHD-24","set":"BHD","n":24,"q":"What is the purpose of a shaft tunnel?","o":["To protect the propeller shaft and provide a watertight compartment.","To store cargo.","To increase fuel capacity.","To support the main engine."],"a":0,"topic":"pil","exp":"Shaft tunnel (อุโมงค์เพลา) ปกป้องเพลาใบจักรเมื่อห้องเครื่องไม่ได้อยู่ท้ายสุด และเป็นห้องผนึกกันน้ำ","wrong":"ไม่ใช่ที่เก็บสินค้า ไม่เพิ่มถังน้ำมัน ไม่รับเครื่องหลัก","terms":["Shaft tunnel = อุโมงค์เพลา"]},"BHD-25":{"id":"BHD-25","set":"BHD","n":25,"q":"What does the shaft tunnel provide for the shaft?","o":["A space for inspection and repair.","A fuel supply.","A cooling system.","A cargo space."],"a":0,"topic":"pil","exp":"อุโมงค์เพลามีพื้นที่ให้ลูกเรือเข้าไปตรวจและซ่อมเพลาได้","wrong":"ไม่ได้จ่ายน้ำมัน เป็นระบบหล่อเย็น หรือเป็นที่เก็บสินค้า","terms":["Inspection = การตรวจ"]},"BHD-26":{"id":"BHD-26","set":"BHD","n":26,"q":"What is the prime function of pillars?","o":["To carry deck loads vertically to the ship's bottom structure.","To carry passengers.","To control the rudder.","To store ballast water."],"a":0,"topic":"pil","exp":"หน้าที่หลักของ pillar (เสาค้ำ) คือถ่ายน้ำหนักดาดฟ้าลงแนวดิ่งสู่โครงสร้างท้องเรือ","wrong":"ไม่ได้ไว้รับคน คุมหางเสือ หรือเก็บน้ำอับเฉา","terms":["Pillar = เสาค้ำ","Deck load = น้ำหนักบนดาดฟ้า"]},"BHD-27":{"id":"BHD-27","set":"BHD","n":27,"q":"What type of loading do hold pillars primarily carry?","o":["Tensile loading.","Compressive loading.","Torsional loading.","Impact loading."],"a":1,"topic":"pil","exp":"เสาค้ำในระวาง (hold pillars) รับแรงอัด (compressive loading) เป็นหล ","o":["A superstructure that contributes to the overall strength of the hull girder.","A superstructure used only for accommodation.","A temporary structure on deck.","A structure used only for cargo loading."],"a":0,"topic":"sup","exp":"Effective superstructure คือโครงสร้างส่วนบนที่ยาวพอและต่อเนื่องกับตัวเรือ จึงช่วยรับแรงของคานตัวเรือ","wrong":"ใช้เป็นที่พักอย่างเดียว ชั่วคราว หรือขนสินค้าอย่างเดียว ไม่ใช่นิยาม","terms":["Effective = มีผลต่อความแข็งแรง"]},"DCK-32":{"id":"DCK-32","set":"DCK","n":32,"q":"What is used to maintain weathertightness around a weathertight door?","o":["A steel chain.","A rubber gasket.","A wooden beam.","A freeing port."],"a":1,"topic":"sup","exp":"ประตูกันอากาศ (weathertight door) ใช้ปะเก็นยาง (rubber gasket) รอบบานเพื่อผนึก","wrong":"โซ่ คานไม้ ช่องระบายน้ำ ไม่ผนึก","terms":["Weathertight door = ประตูกันลมฟ้าอากาศ"]},"DOF-1":{"id":"DOF-1","set":"DOF","n":1,"q":"Which group contains only rotational motions?","o":["Surge, Sway, Heave","Roll, Pitch, Yaw","Surge, Roll, Heave","Sway, Pitch, Heave"],"a":1,"topic":"mot","exp":"Roll, Pitch, Yaw เป็นการหมุน (rotation) ทั้งสามตัว","wrong":"Surge, Sway, Heave เป็นการเลื่อนตำแหน่ง (translation) ทุกช้อยส์อื่นมีตัว translation ปนอยู่","terms":["Rotational = การหมุน","Translational = การเลื่อนที่"]},"DOF-2":{"id":"DOF-2","set":"DOF","n":2,"q":"Which pair correctly matches the ship motion with its rotation axis?","o":["Pitching – X-axis (Longitudinal) | Yawing – Y-axis (Transverse)","Pitching – Y-axis (Transverse) | Yawing – Z-axis (Vertical)","Pitching – Z-axis (Vertical) | Yawing – X-axis (Longitudinal)","Pitching – X-axis (Longitudinal) | Yawing – Z-axis (Vertical)"],"a":1,"topic":"mot","exp":"Pitch หมุนรอบแกน Y (แกนขวางลำ) และ Yaw หมุนรอบแกน Z (แกนดิ่ง)","wrong":"ช้อยส์อื่นจับคู่แกนผิด (Roll ต่างหากที่หมุนรอบแกน X ตามยาว)","terms":["Pitch = โคลงหัว-ท้าย","Yaw = หันหัว (ส่าย)"]},"DOF-3":{"id":"DOF-3","set":"DOF","n":3,"q":"Which statistical test commonly uses the concept of degree of freedom?","o":["Mean Absolute Error (MAE)","t-test","Linear Scaling","Min-Max Normalization"],"a":1,"topic":"stat","exp":"t-test ใช้ค่า degree of freedom (เช่น df = n − 1) ในการเปิดตาราง t","wrong":"MAE, Linear scaling, Min-Max normalization ไม่ใช้ df","terms":["Degree of freedom (df) = องศาอิสระ"]},"DOF-4":{"id":"DOF-4","set":"DOF","n":4,"q":"What is the difference between heel and list?","o":["Heel and list are the same.","Heel is caused by external forces, while list is caused by internal weight distribution.","Heel is permanent, while list is temporary.","Heel occurs only in passenger ships."],"a":1,"topic":"mot","exp":"Heel (เอียงชั่วคราว) เกิดจากแรงภายนอก เช่น ลม คลื่น การเลี้ยว ส่วน List (เอียงค้าง) เกิดจากการกระจายน้ำหนักภายในไม่สมดุล","wrong":"A ผิดเพราะต่างกัน; C กลับด้าน (list มักค้างจนกว่าจะแก้น้ำหนัก); D เกิดได้กับเรือทุกชนิด","terms":["Heel = การเอียงจากแรงภายนอก","List = การเอียงจากน้ำหนักภายใน"]},"DOF-5":{"id":"DOF-5","set":"DOF","n":5,"q":"Which degree of freedom describes the ship moving sideways without changing its heading?","o":["Surge","Heave","Sway","Pitch"],"a":2,"topic":"mot","exp":"Sway คือการเลื่อนออกด้านข้าง (ซ้าย-ขวา) โดยหัวเรือไม่เปลี่ยนทิศ","wrong":"Surge = หน้า-หลัง; Heave = ขึ้น-ลง; Pitch = หัวท้ายขึ้นลง","terms":["Sway = การเลื่อนด้านข้าง"]},"DOF-6":{"id":"DOF-6","set":"DOF","n":6,"q":"A \"Yaw\" motion is described as which type of movement of the bow and stern?","o":["Up-and-down movement.","Side-to-side movement","Front-to-back movement.","Tilting towards port or starboard."],"a":1,"topic":"mot","exp":"Yaw คือการที่หัวและท้ายเรือส่ายไปด้านข้าง (side-to-side) หมุนรอบแกนดิ่ง","wrong":"A = Pitch; C = Surge; D = Roll","terms":["Yaw = การส่ายหัว"]},"DOF-7":{"id":"DOF-7","set":"DOF","n":7,"q":"Which motion describes the forward and backward movement of a ship?","o":["Sway","Surge","Heave","Roll"],"a":1,"topic":"mot","exp":"Surge คือการเคลื่อนที่ไปหน้า-ถอยหลังตามแกนยาวเรือ","wrong":"Sway = ด้านข้าง; Heave = ขึ้นลง; Roll = หมุนโคลงข้าง","terms":["Surge = การเลื่อนหน้า-หลัง"]},"DOF-8":{"id":"DOF-8","set":"DOF","n":8,"q":"Which term describes the motion where a vessel tilts from side to side (left and right) without the bow pitching up and down?","o":["Surge and Pitch","Roll","Heave","Yaw"],"a":1,"topic":"mot","exp":"Roll คือการโคลงซ้าย-ขวา (หมุนรอบแกนยาว) โดยหัวเรือไม่ขึ้นลง","wrong":"Pitch คือหัวท้ายขึ้นลง; Heave คือทั้งลำยกขึ้นลง; Yaw คือส่ายหัว","terms":["Roll = การโคลงข้าง"]},"DOF-9":{"id":"DOF-9","set":"DOF","n":9,"q":"A quality control inspector randomly selects 15 batteries from a production line to estimate the average battery life. How many degrees of freedom are used to calculate the sample variance?","o":["15","14","13","16"],"a":1,"topic":"stat","exp":"ความแปรปรวนของตัวอย่าง (sample variance) ใช้ df = n − 1 = 15 − 1 = 14 เพราะเสียไป 1 ค่าในการประมาณค่าเฉลี่ย","wrong":"15 คือขนาดตัวอย่าง (ไม่ใช่ df); 13, 16 คำนวณผิด","terms":["Sample variance = ความแปรปรวนของตัวอย่าง","s² = Σ(xᵢ − x̄)² / (n − 1)"],"steps":["ข้อมูล: ขนาดตัวอย่าง n = 15 ก้อน","สูตรความแปรปรวนของตัวอย่าง: s² = Σ(xᵢ − x̄)² / (n − 1)","ตัวหาร (n − 1) คือ degree of freedom เพราะเมื่อรู้ x̄ แล้ว ส่วนเบี่ยงเบนตัวสุดท้ายถูกบังคับให้ Σ(xᵢ − x̄) = 0","df = 15 − 1 = 14 (ไม่มีหน่วย)","ตรวจด้วยโค้ด: numpy.var(x, ddof=1) ให้ค่าเท่ากับ Σ(xᵢ − x̄)²/14 ✔"]},"DOF-10":{"id":"DOF-10","set":"DOF","n":10,"q":"Which set of coupled hydrodynamic movements is most critical to analyze when assessing the risk of parametric rolling in head or following seas?","o":["Surge and Sway","Pitch and Heave","Yaw and Sway","Roll and Sway"],"a":1,"topic":"mot","exp":"Parametric rolling เกิดในคลื่นหัว/ท้าย เมื่อคลื่นทำให้ GM เปลี่ยนเป็นจังหวะ ร่วมกับการ Pitch และ Heave จึงต้องวิเคราะห์ Pitch + Heave ที่จับคู่กัน","wrong":"Surge/Sway/Yaw ไม่ใช่ตัวขับให้ GM เปลี่ยนเป็นจังหวะในคลื่นหัว-ท้าย","terms":["Parametric rolling = การโคลงแบบพาราเมตริก","Head seas = คลื่นปะทะหัว","Following seas = คลื่นตามท้าย"]},"DOF-11":{"id":"DOF-11","set":"DOF","n":11,"q":"A marine engineer tests 10 different fuel pump samples to estimate the average fuel flow rate. How many degrees of freedom are available to calculate the sample variance?","o":["10","9","8","11"],"a":1,"topic":"stat","exp":"df = n − 1 = 10 − 1 = 9","wrong":"10 คือจำนวนตัวอย่าง; 8, 11 คำนวณผิด","terms":["s² = Σ(xᵢ − x̄)² / (n − 1)"],"steps":["ข้อมูล: n = 10 ตัวอย่าง","s² = Σ(xᵢ − x̄)² / (n − 1)","df = 10 − 1 = 9 (ไม่มีหน่วย)","ตรวจด้วยโค้ด: numpy.var(x, ddof=1) = Σ(xᵢ − x̄)²/9 ✔"]},"DOF-12":{"id":"DOF-12","set":"DOF","n":12,"q":"When side waves force a vessel to move laterally to the port or starboard along its transverse axis, what is this motion called?","o":["Yaw","Sway","Roll","Surge"],"a":1,"topic":"mot","exp":"คลื่นด้านข้างดันเรือเลื่อนไปทางกราบซ้าย/ขวาตามแกนขวาง = Sway","wrong":"Yaw = หมุนส่ายหัว; Roll = หมุนโคลง; Surge = หน้า-หลัง","terms":["Port = กราบซ้าย","Starboard = กราบขวา","Transverse axis = แกนขวางลำ"]},"DOF-13":{"id":"DOF-13","set":"DOF","n":13,"q":"Which of the following correctly pairs the ship motion with its corresponding axis and motion type?","o":["Roll: Translational motion along the X-axis | Sway: Rotational motion around the Y-axis","Pitch: Rotational motion around the Y-axis | Surge: Translational motion along the X-axis","Pitch: Translational motion along the Z-axis | Surge: Rotational motion around the X-axis","Roll: Rotational motion around the Y-axis | Sway: Translational motion along the Z-axis"],"a":1,"topic":"mot","exp":"Pitch = หมุนรอบแกน Y และ Surge = เลื่อนตามแกน X ถูกทั้งคู่","wrong":"A: Roll เป็นการหมุน (ไม่ใช่เลื่อน) และ Sway เป็นการเลื่อน; C: สลับประเภทกัน; D: Roll หมุนรอบ X และ Sway เลื่อนตาม Y","terms":[]},"DOF-14":{"id":"DOF-14","set":"DOF","n":14,"q":"Which of the following correctly describes the Heave and Yaw motions of a ship?","o":["Heave: Linear motion forward and backward along the X-axis | Yaw: Rotational motion around the Y-axis","Heave: Linear motion sideways along the Y-axis | Yaw: Rotational motion around the Y-axis","Heave: Vertical linear ,"terms":["Centre line = แนวกึ่งกลางลำ"]},"FWD-9":{"id":"FWD-9","set":"FWD","n":9,"q":"The thickness of the stem plate may taper to that of which plating at the stem head?","o":["Deck plating","Keel plate","Bulkhead plating","Side shell"],"a":3,"topic":"bow","exp":"แผ่นทวนหัวค่อยๆ บางลงจนเท่าความหนาเปลือกข้าง (side shell) ที่ยอดทวน","wrong":"ดาดฟ้า กระดูกงู ผนังกั้น ไม่ใช่แผ่นที่ต่อเนื่องกับทวนหัวด้านบน","terms":["Side shell = เปลือกข้างเรือ","Taper = ค่อยๆ ลดขนาด"]},"FWD-10":{"id":"FWD-10","set":"FWD","n":10,"q":"What is a bulbous bow usually intended to do?","o":["Reduce the vessel's resistance to motion","Increase the vessel's draught","Provide space for the chain locker","Strengthen the stem bar"],"a":0,"topic":"bow","exp":"Bulbous bow (หัวเรือแบบกระเปาะ) สร้างคลื่นหักล้างคลื่นหัวเรือ จึงลดความต้านทานการเคลื่อนที่","wrong":"ไม่ได้มีไว้เพิ่มกินน้ำลึก เก็บโซ่ หรือเสริมทวนหัว","terms":["Bulbous bow = หัวเรือแบบกระเปาะ","Resistance = ความต้านทาน"]},"FWD-11":{"id":"FWD-11","set":"FWD","n":11,"q":"Which vessels are often found with a bulbous bow?","o":["Small tugs only","Slow vessels with low block coefficients","Higher-speed vessels and those with high block coefficients","Double-ended ferries only"],"a":2,"topic":"bow","exp":"พบหัวกระเปาะบ่อยในเรือความเร็วสูงและเรือที่มี block coefficient (Cb) สูง เช่น tanker, bulk carrier","wrong":"B ตรงข้าม (Cb ต่ำและช้า); ลากจูงเล็ก/เฟอร์รี่สองหัว ไม่ใช่กลุ่มหลัก","terms":["Block coefficient (Cb) = สัมประสิทธิ์บล็อก (ความอ้วนของตัวเรือ)"]},"FWD-12":{"id":"FWD-12","set":"FWD","n":12,"q":"In a bulbous bow, floors are fitted at which spacing?","o":["Every frame space","Every fifth frame","Every tenth frame","Only at the centre line"],"a":0,"topic":"bow","exp":"ในกระเปาะหัวเรือ ติด floor (แผ่นพื้น) ทุกช่วงกง (every frame space)","wrong":"ทุก 5 กงคือระยะของ transverses ในกระเปาะยาว","terms":["Floor = แผ่นพื้นท้องเรือ","Frame space = ระยะห่างระหว่างกง"]},"FWD-13":{"id":"FWD-13","set":"FWD","n":13,"q":"In long bulbs, transverses are fitted at about every how many frames?","o":["Second","Third","Fifth","Tenth"],"a":2,"topic":"bow","exp":"ในกระเปาะยาว ติด transverses (โครงขวางใหญ่) ประมาณทุก 5 กง","wrong":"ทุกกงเป็นระยะของ floor; 2, 3, 10 ไม่ตรงตำรา","terms":["Transverse = โครงขวาง"]},"FWD-14":{"id":"FWD-14","set":"FWD","n":14,"q":"When is a centre line wash bulkhead introduced in a bulb?","o":["When the bulb is small","When the bulb is large","Only on tugs","Only on icebreakers"],"a":1,"topic":"bow","exp":"เมื่อกระเปาะใหญ่ จะเพิ่มผนังกันกระฉอกกลางลำ (centre line wash bulkhead)","wrong":"กระเปาะเล็กไม่จำเป็น; ไม่ได้จำกัดเฉพาะเรือลากจูง/ตัดน้ำแข็ง","terms":["Wash bulkhead = ผนังกันกระฉอก"]},"FWD-15":{"id":"FWD-15","set":"FWD","n":15,"q":"What is fitted in all bulbous bows?","o":["Wash bulkheads","Mud boxes","Horizontal diaphragm plates","Chain pipes"],"a":2,"topic":"bow","exp":"กระเปาะหัวเรือทุกแบบมี horizontal diaphragm plates (แผ่นไดอะแฟรมแนวนอน)","wrong":"wash bulkhead มีเฉพาะกระเปาะใหญ่; mud box/chain pipe เป็นของห้องโซ่","terms":["Diaphragm = แผ่นกั้นแนวนอน"]},"FWD-16":{"id":"FWD-16","set":"FWD","n":16,"q":"Increased shell thickness on the bulb should cover areas likely to be damaged by what?","o":["Waves","Anchors and chains","Propellers","Cargo"],"a":1,"topic":"bow","exp":"เพิ่มความหนาเปลือกกระเปาะบริเวณที่อาจโดนสมอและโซ่กระแทก","wrong":"คลื่น ใบจักร สินค้า ไม่ใช่สาเหตุหลักในบริเวณนั้น","terms":["Anchor = สมอ","Chain/cable = โซ่สมอ"]},"FWD-17":{"id":"FWD-17","set":"FWD","n":17,"q":"If a chain locker is fitted aft of the collision bulkhead, it must be what?","o":["Open to the sea","Without drainage","Smaller than usual","Watertight with proper drainage"],"a":3,"topic":"chain","exp":"ถ้าห้องโซ่อยู่หลังผนังกั้นการชน ต้องผนึกกันน้ำและมีระบบระบายน้ำที่เหมาะสม (เพราะอยู่ในส่วนที่ต้องกันน้ำ)","wrong":"เปิดสู่ทะเล/ไม่มีระบาย อันตราย; ขนาดไม่เกี่ยว","terms":["Watertight = ผนึกกันน้ำ","Drainage = การระบายน้ำ"]},"FWD-18":{"id":"FWD-18","set":"FWD","n":18,"q":"Chain locker dimensions are determined in relation to what?","o":["The length and size of the cable","The ship's speed","The number of crew","The size of the propeller"],"a":0,"topic":"chain","exp":"ขนาดห้องโซ่กำหนดจากความยาวและขนาดของโซ่สมอ (cable)","wrong":"ความเร็ว จำนวนลูกเรือ ขนาดใบจักร ไม่เกี่ยว","terms":["Cable = โซ่สมอ"]},"FWD-19":{"id":"FWD-19","set":"FWD","n":19,"q":"How are port and starboard cables stowed in the chain locker?","o":["Together in one pile","On deck","Outside the locker","Separately"],"a":3,"topic":"chain","exp":"โซ่ฝั่งซ้ายและขวาเก็บแยกกัน (แยกด้วยผนังกลางลำ) เพื่อไม่ให้พันกัน","wrong":"กองรวมจะพันกัน; ไม่ได้เก็บบนดาดฟ้าหรือนอกห้อง","terms":[]},"FWD-20":{"id":"FWD-20","set":"FWD","n":20,"q":"The inboard ends of the cables are secured to what?","o":["The windlass","The bottom of the centre line bulkhead or underside of deck","The hawse pipe","The anchor"],"a":1,"topic":"chain","exp":"ปลายโซ่ด้านในยึดกับตีนผนังกลางลำ (centre line bulkhead) หรือใต้ดาดฟ้า (มักผ่านตัวปลดโซ่ฉุกเฉิน)","wrong":"กว้าน ท่อโซ่ และสมอ อยู่อีกปลายหรือเป็นทางผ่าน","terms":["Inboard end = ปลายด้านใน"]},"FWD-21":{"id":"FWD-21","set":"FWD","n":21,"q":"Why does the centre line bulkhead in the chain locker not extend to the crown?","o":["To save weight","To allow water to drain","To allow working space above the two compartments","To provide ventilation for the engine"],"a":2,"topic":"chain","exp":"ผนังกลางลำในห้องโซ่ไม่สูงถึงเพดาน (crown) เพื่อเว้นที่ทำงานเหนือสองช่อง","wrong":"ไม่ได้มีเหตุผลเพื่อลดน้ำหนัก ระบายน้ำ หรือระบายอากาศห้องเครื่อง","terms":["Crown = เพดาน/หลังคาห้อง"]},"FWD-22":{"id":"FWD-22","set":"FWD","n":22,"q":"A false bottom of perforated plates in the chain locker forms what?","o":["A wash plate","A mud box","A breast hook","A spurling pipe"],"a":1,"topic":"chain","exp":"พื้นหลอกทำจากแผ่นเจาะรู (perforated plates) ที่ก้นห้องโซ่ เรียกว่า mud box (กล่องโคลน) ให้โคลน/น้ำแยกลงไปก่อนระบาย","wrong":"wash plate ลดกระฉอก; breast hook ค้ำหัว; spurling pipe คือท่อโซ่","terms":["Mud box = กล่องรองโคลน","Perforated plate = แผ่นเจาะรู"]},"FWD-23":{"id":"FWD-23","set":"FWD","n":23,"q":"Why are chain locker stiffeners conveniently arranged outside the locker if possible?","o":["To prevent them being damaged","To save steel","To make welding easier","To improve ventilation"],"a":0,"topic":"chain","exp":"ติด stiffener ไว้นอกห้องโซ่ถ้าทำได้ เพื่อไม่ให้โซ่ฟาดเสียหาย","wrong":"ไม่ใช่เหตุผลเรื่องประหยัดเหล็ก เชื่อมง่าย หรือระบายอากาศ","terms":[]},"FWD-24":{"id":"FWD-24","set":"FWD","n":24,"q":"What are the foot holes cut in the centre line bulkhead used for?","o":["Draining water","Passing cables","Ventilation","Access to the bottom of the locker"],"a":3,"topic":"chain","exp":"รูเหยียบ (foot holes) ที่ผนังกลางลำใช้ปีนลงถึงก้นห้องโซ่","wrong":"ไม่ใช่ทางระบายน้ำ ทางผ่านโซ่ หรือช่องลม","terms":["Foot hole = รูเหยียบ/ช่องปีน"]},"FWD-25":{"id":"FWD-25","set":"FWD","n":25,"q":"What type of stiffeners are fitted to the centre line bulkhead of the chain locker?","o":["Vertical flush cope bar type","Angle bar type","Bulb flat type","Horizontal tee type"],"a":0,"topic":"chain","exp":"ผนังกลางลำห้องโซ่ติด stiffener แนวดิ่งแบบเรียบ (vertical flush cope bar) ไม่ให้โซ่เกี่ยว","wrong":"angle/bulb flat/tee ยื่นออกมา โซ่จะเกี่ยวหรือกระแทก","terms":["Flush = เรียบเสมอผิว"]},"FWD-26":{"id":"FWD-26","set":"FWD","n":26,"q":"Chain pipes are also known as what?","o":["Hawse pipes","Spurling pipes","Suction pipes","Tunnel pipes"],"a":1,"topic":"chain","exp":"Chain pipes (ท่อนำโซ่ลงห้องโซ่) เรียกอีกชื่อว่า Spurling pipes","wrong":"Hawse pipe คือท่อสมอจากดาดฟ้าทะลุเปลือกเรือ (คนละท่อ)","terms":["Spurling pipe = ท่อนำโซ่ลงห้องเก็บโซ่"]},"FWD-27":{"id":"FWD-27","set":"FWD","n":27,"q":"What do hawse pipes provide?","o":["Drainage for the forepeak","Ventilation for the locker","An easy lead for the cable from the windlass to the anchors","Support for the stem"],"a":2,"topic":"chain","exp":"Hawse pipes (ท่อสมอ) เป็นทางนำโซ่จากกว้านไปยังสมอได้สะดวก และเก็บสมอ","wrong":"ไม่ได้ระบายน้ำ ระบายอากาศ หรือค้ำทวนหัว","ter function answer(oi){const ss=S.sess,e=ss.q[ss.i];if(e.ch!=null)return;const q=QS[e.qid];e.ch=oi;const ok=oi===q.a;
 const r=record(e.item,ok);e.prev=r.prev;e.now=r.now;e.ok=ok;
 ss.streak=ok?ss.streak+1:0;if(ss.streak>S.best)S.best=ss.streak;save();showFb(false);

const PRAISE=['เก่งมาก','แม่นเป๊ะ','สุดยอดคาเด็ท','ใช่เลย','เยี่ยม','ไปต่อ!'];

function cheer(n){const msg={3:'🔥 ถูก 3 ข้อติด! เรือออกจากท่าแล้ว',5:'⛵ ถูก 5 ข้อติด! ลมส่งท้ายดีมาก',10:'🚢 10 ข้อติด! กัปตันยังต้องชม',15:'🌟 15 ข้อติด! แม่นยิ่งกว่าเข็มทิศ',20:'🏝️ 20 ข้อติด! เห็นเกาะแล้ว',30:'🏆 30 ข้อติด! ระดับชีฟแล้ว',50:'👑 50 ข้อติด! ตำนานแห่งท้องทะเล'}[n];toast(msg);confetti()}

 main().innerHTML=`<div class="qhead"><button class="btn ghost" id="qX">✕ ออก</button><div class="prog"><i style="width:${answered/ss.q.length*100}%"></i></div><span class="muted small">ตอบแล้ว ${answered}/${ss.q.length}</span>${ss.end?'<span class="timer" id="tm">--:--</span>':''}</div>
 <section class="card qcard"><div class="row" style="justify-content:space-between"><span class="pill">ข้อ ${ss.i+1} / ${ss.q.length}</span><button class="icon-btn" id="qPin" title="ปักหมุด">${S.pins[e.item]?'⭐':'☆'}</button></div>
 <div class="qtext">${esc(q.q)}</div><div class="opts">${p.map((oi,k)=>`<button class="opt ${e.ch===oi?'sel':''}" data-oi="${oi}"><span class="k">${LETTERS[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>
 <div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn" id="mP" ${ss.i?'':'disabled'}>← ก่อนหน้า</button><button class="btn ${ss.i+1<ss.q.length?'pri':'coral'}" id="mN">${ss.i+1<ss.q.length?'ถัดไป →':'ส่งคำตอบ 🏁'}</button></div></section>
 <section class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><span class="small muted">กระดานข้อ</span><button class="btn coral" id="mS">ส่งคำตอบ</button></div><div class="palette">${ss.q.map((x,k)=>`<button class="${x.ch!=null?'ans':''} ${k===ss.i?'cur':''}" data-k="${k}">${k+1}</button>`).join('')}</div></section>`;
 $('#qX').onclick=()=>{save();go('home')};$('#qPin').onclick=()=>{togglePin(e.item);$('#qPin').textContent=S.pins[e.item]?'⭐':'☆'};
 main().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{e.ch=+b.dataset.oi;save();main().querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));const pb=main().querySelector(`.palette [data-k="${ss.i}"]`);pb&&pb.classList.add('ans')});
 $('#mP').onclick=()=>{ss.i--;save();renderMock()};
 $('#mN').onclick=()=>{if(ss.i+1<ss.q.length){ss.i++;save();renderMock()}else submitAsk()};
 $('#mS').onclick=submitAsk;
 main().querySelectorAll('.palette button').forEach(b=>b.onclick=()=>{ss.i=+b.dataset.k;save();renderMock()});
 if(ss.end){clearInterval(TIMER);const tick=()=>{const left=ss.end-Date.now();const el=$('#tm');if(!el)return;if(left<=0){clearInterval(TIMER);TIMER=null;submitMock();return}const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',left<300000)};tick();TIMER=setInterval(tick,1000)}
}
function submitAsk(){const ss=S.sess,un=ss.q.filter(x=>x.ch==null).length;confirmBox(un?`ยังไม่ได้ตอบ ${un} ข้อ (ข้อที่ไม่ตอบนับเป็นผิดในคะแนน แต่ไม่เปลี่ยนสถานะข้อ) ต้องการส่งคำตอบเลยไหม?`:'ส่งคำตอบและตรวจคะแนน?','ส่งคำตอบ',submitMock)}
function submitMock(){const ss=S.sess;if(!ss||ss.done)return;clearInterval(TIMER);TIMER=null;
 ss.q.forEach(e=>{if(e.ch==null){e.prev=e.now=stOf(e.item);return}const ok=e.ch===QS[e.qid].a;const r=record(e.item,ok);e.prev=r.prev;e.now=r.now});ss.done=true;ss.used=Date.now()-ss.start;save();closeModal();renderMockResult()}
function renderMockResult(){const ss=S.sess,ok=ss.q.filter(e=>e.ch===QS[e.qid].a),wrong=ss.q.filter(e=>e.ch!==QS[e.qid].a),promoted=ss.q.filter(e=>e.prev!=='ok'&&e.now==='ok');
 const by={};ss.q.forEach(e=>{const t=ITEM[e.item].topic;by[t]=by[t]||[0,0];by[t][1]++;if(e.ch===QS[e.qid].a)by[t][0]++});
 const pct=Math.round(ok.length/ss.q.length*100),mins=Math.round((ss.used||0)/60000);
 main().innerHTML=`<section class="card" style="text-align:center"><h2>ผลจำลองสอบ</h2><div class="big" style="margin:12px 0">${ok.length} / ${ss.q.length}</div><div>${pct}% · ใช้เวลา ${mins} นาที</div>
 <div class="counts" style="justify-content:center"><span>🟢 เลื่อนเป็นแม่นแล้ว ${promoted.length}</span><span>❌ ผิด/ไม่ได้ตอบ ${wrong.length}</span></div>
 <div class="row" style="justify-content:center;margin-top:14px">${wrong.length?'<button class="btn coral" id="rW">ทำเฉพาะข้อที่ผิด</button>':''}<button class="btn" data-go="home">กลับหน้าหลัก</button></div></section>
 <section class="card" style="margin-top:14px"><h3>ผลแยกตามหัวข้อ</h3><table class="res"><tr><th>หัวข้อ</th><th>ถูก</th><th>%</th></tr>${TOPICS.filter(t=>by[t.id]).map(t=>{const [a,b]=by[t.id];return `<tr><td>${esc(t.en)}<div class="small muted">${esc(t.th)}</div></td><td>${a}/${b}</td><td style="color:${a/b>=.8?'var(--ok)':a/b>=.5?'var(--rev)':'var(--bad)'};font-weight:700">${Math.round(a/b*100)}%</td></tr>`}).join('')}</table></section>
 ${wrong.length?`<section class="card" style="margin-top:14px"><h3>❌ ข้อที่ผิด พร้อมเฉลย</h3>${wrong.map(wrongRow).join('')}</section>`:''}`;
 if(wrong.length)$('#rW').onclick=()=>startSession('ทำเฉพาะข้อที่ผิด (จำลองสอบ)',wrong.map(e=>e.item),'practice',wrong.map(e=>e.qid));
 S.sess=null;save()}
// ---------- modal ----------
function openModal(h){$('#modalBox').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{const f=e.target.closest('.fig[data-fig]');if(f&&!f.closest('.modal')){openModal(`<div class="row" style="justify-content:flex-end"><button class="btn" data-close>ปิด ✕</button></div>${document.getElementById(f.dataset.fig).innerHTML}`)}});
function confirmBox(msg,okLabel,fn){openModal(`<h3>${esc(msg)}</h3><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-close>ยกเลิก</button><button class="btn coral" id="cOk">${esc(okLabel)}</button></div>`);$('#cOk').onclick=()=>{closeModal();fn()}}
// ---------- settings / theme ----------
function applyTheme(){const t=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;$('#themeBtn').textContent=t==='dark'?'☀️':'🌙'}
$('#themeBtn').onclick=()=>{S.theme=(document.documentElement.dataset.theme==='dark')?'light':'dark';save();applyTheme()};
$('#setBtn').onclick=()=>{openModal(`<div class="row" style="justify-content:space-between"><h3>ตั้งค่า</h3><button class="btn" data-close>ปิด ✕</button></div>
 <div style="display:grid;gap:14px;margin-top:14px"><label class="sw"><input type="checkbox" id="sSh" ${S.set.shuffle?'checked':''}><span class="tr"></span>สุ่มลำดับช้อยส์ (เปิด = กันจำตำแหน่ง · ปิด = เรียงตามต้นฉบับ)</label>
 <label class="sw"><input type="checkbox" id="sTm" ${S.set.timer?'checked':''}><span class="tr"></span>จับเวลาในโหมดจำลองสอบ</label>
 <div class="small muted">สถิติ: ตอบถูกติดกันสูงสุด ${S.best} ข้อ · ปักหมุด ${Object.keys(S.pins).length} ข้อ</div>
 <hr style="border:0;border-top:1px solid var(--line);width:100%"><button class="btn" id="sRs" style="color:var(--bad);justify-self:start">🗑️ รีเซ็ตความคืบหน้า</button></div>`);
 $('#sSh').onchange=e=>{S.set.shuffle=e.target.checked;save()};$('#sTm').onchange=e=>{S.set.timer=e.target.checked;save()};
 $('#sRs').onclick=()=>confirmBox('ลบสถานะทุกข้อ คะแนน และหมุดทั้งหมด? ย้อนกลับไม่ได้','รีเซ็ต',()=>{const th=S.theme,set=S.set;S={st:{},pins:{},set,theme:th,sess:null,best:0};save();toast('รีเซ็ตแล้ว เริ่มออกเรือใหม่ ⛵');go('home')})};
applyTheme();
if(S.sess&&S.sess.mode==='mock'&&S.sess.end&&!S.sess.done&&Date.now()>S.sess.end){VIEW='quiz';submitMock()}else go('home');
</script>
</body>
</html>
